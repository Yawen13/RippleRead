services:
  app:
    build: .
    container_name: rippleread
    ports:
      - "8001:8001"
    volumes:
      - rippleread_data:/app/data
      - ./config.json:/app/config.json:ro
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/rippleread.db
      - HOST=0.0.0.0
      - PORT=8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rippleread_data:
    driver: local
