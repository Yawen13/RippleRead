<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RippleRead</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/login.css">

  <!-- Script -->
  <script src="/static/js/auth.js" defer></script>
</head>
<body>

<div class="auth-container">

  <!-- ── Decorative Left Panel ── -->
  <aside class="auth-illustration" aria-hidden="true">
    <div class="ill-shape ill-wave"></div>
    <div class="ill-shape ill-circle ill-circle--1"></div>
    <div class="ill-shape ill-circle ill-circle--2"></div>
    <div class="ill-shape ill-circle ill-circle--3"></div>
    <div class="ill-shape ill-dot-grid"></div>

    <!-- Abstract open-book -->
    <div class="ill-book">
      <div class="ill-book-page ill-book-page--left"></div>
      <div class="ill-book-page ill-book-page--right"></div>
      <div class="ill-book-spine"></div>
    </div>

    <div class="ill-ripple ill-ripple--1"></div>
    <div class="ill-ripple ill-ripple--2"></div>
    <div class="ill-ripple ill-ripple--3"></div>

    <p class="ill-tagline">Dive into stories<br>that ripple through you.</p>
  </aside>

  <!-- ── Form Panel ── -->
  <main class="auth-forms">

    <!-- Header + logo -->
    <header class="auth-header">
      <div class="auth-logo" aria-label="RippleRead logo">
        <svg class="auth-logo-icon" viewBox="0 0 40 40" width="40" height="40" fill="none">
          <circle cx="20" cy="20" r="18" fill="var(--brand-teal)" opacity=".12"/>
          <path d="M20 6 L24 16 L34 16 L26 22 L29 32 L20 26 L11 32 L14 22 L6 16 L16 16 Z" fill="var(--brand-teal)"/>
        </svg>
        <span class="auth-logo-text">RippleRead</span>
      </div>
    </header>

    <!-- Feedback toast (hidden by default) -->
    <div class="auth-toast" role="alert" aria-live="assertive" hidden></div>

    <!-- ═══════════  LOGIN FORM  ═══════════ -->
    <form class="auth-form auth-form--login active" id="loginForm" novalidate>
      <fieldset>
        <legend class="auth-form-title">Welcome back</legend>
        <p class="auth-form-sub">Sign in to your reading sanctuary.</p>
      </fieldset>

      <div class="auth-field">
        <label for="loginEmail" class="auth-label">Email</label>
        <div class="auth-input-wrapper">
          <svg class="auth-input-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 5a1 1 0 011-1h12a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V5zm1.5 0l5.5 4.5L15.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            type="email"
            id="loginEmail"
            name="email"
            class="auth-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>
        <span class="auth-error" id="loginEmailError" role="alert"></span>
      </div>

      <div class="auth-field">
        <div class="auth-field-header">
          <label for="loginPassword" class="auth-label">Password</label>
          <a href="#" class="auth-forgot-link">Forgot?</a>
        </div>
        <div class="auth-input-wrapper">
          <svg class="auth-input-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="3" y="8" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 8V5a3 3 0 116 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            type="password"
            id="loginPassword"
            name="password"
            class="auth-input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <button type="button" class="auth-psw-toggle" data-target="loginPassword" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M2.5 10s3.5-5 7.5-5 7.5 5 7.5 5-3.5 5-7.5 5-7.5-5-7.5-5z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="display:none">
              <path d="M2.5 10s3.5-5 7.5-5 7.5 5 7.5 5-3.5 5-7.5 5-7.5-5-7.5-5z" stroke="currentColor" stroke-width="1.5"/>
              <line x1="3" y1="3" x2="17" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <span class="auth-error" id="loginPasswordError" role="alert"></span>
      </div>

      <button type="submit" class="auth-submit">
        Sign In
        <svg class="auth-submit-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 10h10M10 5l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <p class="auth-switch">
        New to RippleRead?
        <button type="button" class="auth-switch-link" data-switch="register">Create an account</button>
      </p>
    </form>

    <!-- ═══════════  REGISTER FORM  ═══════════ -->
    <form class="auth-form auth-form--register" id="registerForm" novalidate>
      <fieldset>
        <legend class="auth-form-title">Join RippleRead</legend>
        <p class="auth-form-sub">Start your reading journey today.</p>
      </fieldset>

      <div class="auth-field">
        <label for="regUsername" class="auth-label">Username</label>
        <div class="auth-input-wrapper">
          <svg class="auth-input-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M3.5 17.5a6.5 6.5 0 0113 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            type="text"
            id="regUsername"
            name="username"
            class="auth-input"
            placeholder="your_username"
            required
            autocomplete="username"
            minlength="3"
          >
        </div>
        <span class="auth-error" id="regUsernameError" role="alert"></span>
      </div>

      <div class="auth-field">
        <label for="regEmail" class="auth-label">Email</label>
        <div class="auth-input-wrapper">
          <svg class="auth-input-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 5a1 1 0 011-1h12a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V5zm1.5 0l5.5 4.5L15.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            type="email"
            id="regEmail"
            name="email"
            class="auth-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>
        <span class="auth-error" id="regEmailError" role="alert"></span>
      </div>

      <div class="auth-field">
        <label for="regPassword" class="auth-label">Password</label>
        <div class="auth-input-wrapper">
          <svg class="auth-input-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="3" y="8" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 8V5a3 3 0 116 0v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input
            type="password"
            id="regPassword"
            name="password"
            class="auth-input"
            placeholder="Min. 8 characters"
            required
            autocomplete="new-password"
            minlength="8"
          >
          <button type="button" class="auth-psw-toggle" data-target="regPassword" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M2.5 10s3.5-5 7.5-5 7.5 5 7.5 5-3.5 5-7.5 5-7.5-5-7.5-5z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="display:none">
              <path d="M2.5 10s3.5-5 7.5-5 7.5 5 7.5 5-3.5 5-7.5 5-7.5-5-7.5-5z" stroke="currentColor" stroke-width="1.5"/>
              <line x1="3" y1="3" x2="17" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <span class="auth-error" id="regPasswordError" role="alert"></span>
      </div>

      <button type="submit" class="auth-submit">
        Create Account
        <svg class="auth-submit-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 10h10M10 5l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <p class="auth-switch">
        Already have an account?
        <button type="button" class="auth-switch-link" data-switch="login">Sign in</button>
      </p>
    </form>

    <!-- ═══════════  SOCIAL LOGIN  ═══════════ -->
    <div class="auth-social">
      <span class="auth-social-label">or continue with</span>
      <div class="auth-social-btns">
        <button type="button" class="auth-social-btn" disabled>
          <svg class="auth-social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button type="button" class="auth-social-btn" disabled>
          <svg class="auth-social-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          GitHub
        </button>
      </div>
    </div>

  </main>
</div>

</body>
</html>
